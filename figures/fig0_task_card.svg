<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg"><title>Cross-lingual bridge detection task: classify an English-Chinese post pair as no-bridge, translation, reframing, or counter-narrative</title><desc>An English post and a Chinese post about the same event are shown as abstract cards. The task is to decide which relation the Chinese post bears to the English claim: no bridge, translation (A), reframing (B), or counter-narrative (C). In the example the pair shares one specific claim but opposes its framing, so the correct label is C.</desc>
<style>
.t{font-family:sans-serif;font-size:14px;font-weight:500}.ts{font-family:sans-serif;font-size:12px;font-weight:400}
.tsi{font-family:sans-serif;font-size:12px;font-weight:400;font-style:italic}
.cap{font-family:sans-serif;font-size:12px;font-weight:400;fill:#5a6069}
.c-blue rect{fill:#E6F1FB;stroke:#2B6CB0;stroke-width:1.5}.c-blue .t{fill:#0C447C}.c-blue .ts{fill:#1A5694}
.c-red rect{fill:#FCEAEA;stroke:#C0392B;stroke-width:1.5}.c-red .t{fill:#7B241C}.c-red .ts,.c-red .tsi{fill:#A23227}
.c-gray rect{fill:#F0F1F2;stroke:#8a8f98;stroke-width:1.5}.c-gray .t{fill:#3a3f47}.c-gray .ts{fill:#5a6069}
.c-amber rect{fill:#FCF1DC;stroke:#C8922B;stroke-width:1.5}.c-amber .t{fill:#7A5713}.c-amber .ts{fill:#9A6F1C}
.c-pick rect{fill:#FCEAEA;stroke:#C0392B;stroke-width:2.5}.c-pick .t{fill:#7B241C}.c-pick .ts{fill:#A23227}
</style>
<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8f98"/></marker></defs>

<g class="c-blue"><rect x="36" y="36" width="288" height="96" rx="8"/>
<text class="t" x="52" y="60">English post</text>
<text class="ts" x="52" y="82">"The U.S. cannot annex a NATO ally's</text>
<text class="ts" x="52" y="99">territory by force; the alliance would</text>
<text class="ts" x="52" y="116">not survive it."</text></g>

<g class="c-red"><rect x="356" y="36" width="288" height="96" rx="8"/>
<text class="t" x="372" y="60">Chinese post</text>
<text class="ts" x="372" y="82">"这不是买岛，是美国要抢北极战略空间"</text>
<text class="tsi" x="372" y="101">(Not buying an island: the U.S. is seizing</text>
<text class="tsi" x="372" y="118">Arctic strategic space.)</text></g>

<text class="cap" x="340" y="30" text-anchor="middle">same event · Greenland 2025 · signed lead Δt = t_zh − t_en</text>

<line x1="180" y1="132" x2="310" y2="168" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ma)"/>
<line x1="500" y1="132" x2="370" y2="168" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ma)"/>
<text class="cap" x="340" y="192" text-anchor="middle">Which relation does the Chinese post bear to the English claim?</text>

<g class="c-gray"><rect x="36" y="210" width="110" height="58" rx="8"/><text class="t" x="91" y="234" text-anchor="middle">no</text><text class="ts" x="91" y="252" text-anchor="middle">no bridge</text></g>
<g class="c-blue"><rect x="158" y="210" width="140" height="58" rx="8"/><text class="t" x="228" y="234" text-anchor="middle">A</text><text class="ts" x="228" y="252" text-anchor="middle">translation</text></g>
<g class="c-amber"><rect x="310" y="210" width="140" height="58" rx="8"/><text class="t" x="380" y="234" text-anchor="middle">B</text><text class="ts" x="380" y="252" text-anchor="middle">reframing</text></g>
<g class="c-pick"><rect x="462" y="210" width="182" height="58" rx="8"/><text class="t" x="553" y="234" text-anchor="middle">C ✓</text><text class="ts" x="553" y="252" text-anchor="middle">counter-narrative</text></g>

<text class="cap" x="340" y="300" text-anchor="middle">The pair shares one specific claim (the Greenland acquisition) but opposes its framing → C.</text>
<text class="cap" x="340" y="320" text-anchor="middle">C is the hard class: it shares an event with its target, so similarity and equivalence methods miss it.</text>
<text class="cap" x="340" y="348" text-anchor="middle">Illustrative paraphrase of a benchmark gold pair; no verbatim platform content or engagement metadata.</text>
</svg>
